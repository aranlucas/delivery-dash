name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true

      - name: Build and generate Worker types
        run: pnpm exec cf build

      - name: Prove new regressions fail on the pre-fix implementation
        run: |
          cp src/worker/room-core.ts /tmp/fixed-room-core.ts
          git show a4ec1786eb1cbc94ebc50944b8f033e944007bfe:src/worker/room-core.ts > src/worker/room-core.ts
          trap 'cp /tmp/fixed-room-core.ts src/worker/room-core.ts' EXIT
          for behavior in 'invalid readiness' 'failed readiness write' 'failed join write' 'failed removal write' 'failed last-player deletion'; do
            if pnpm exec vitest run test/worker/index.test.ts -t "$behavior" --reporter=json --outputFile=/tmp/baseline.json; then
              echo "Regression unexpectedly passed against the baseline: $behavior"
              exit 1
            fi
            jq -e '[.testResults[].assertionResults[] | select(.status == "failed") | .failureMessages[] | select(contains("AssertionError"))] | length > 0' /tmp/baseline.json
          done

      - parallel:
          - name: Lint
            run: pnpm lint && pnpm format:check

          - name: Test
            run: pnpm test

          - name: Typecheck
            run: pnpm typecheck

      - name: Install Chromium for deterministic e2e
        run: pnpm exec e2e-web install chromium --with-deps

      - name: Real-worker protocol and browser journeys
        env:
          TEST_GAME_URL: http://127.0.0.1:5173
          TEST_GAME_RUSH_TIMER: "1"
          TEST_GAME_RECONNECT: "1"
          E2E_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p .e2e/logs
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort > .e2e/logs/vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          pnpm test:integration
          echo "Checking that the pre-fix overlay reproduces the City View disconnect regression"
          (
            cp src/client/ui/overlays.tsx /tmp/fixed-overlays.tsx
            trap 'cp /tmp/fixed-overlays.tsx src/client/ui/overlays.tsx' EXIT
            git show a4ec1786eb1cbc94ebc50944b8f033e944007bfe:src/client/ui/overlays.tsx > src/client/ui/overlays.tsx
            baseline_result=0
            pnpm exec e2e run --grep 'lost racing connection' --reporter markdown --output .e2e/baseline || baseline_result=$?
            if [[ "$baseline_result" != 1 ]] || ! jq -e '[.run.results[].attempts[-1].error | select(.code == "ASSERTION_FAILED") | select(.message | contains("CONNECTION LOST"))] | length == 1' .e2e/baseline/report.json > /dev/null; then
              echo "Expected the pre-fix overlay to fail at the CONNECTION LOST assertion (runner exit: $baseline_result)"
              exit 1
            fi
          )
          echo "Confirmed the expected CONNECTION LOST assertion failure on the pre-fix overlay"
          echo "Running all browser tests against the current code"
          pnpm exec e2e run

      - name: Upload failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-evidence
          path: .e2e
          include-hidden-files: true
